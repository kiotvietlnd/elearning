                let currentPage = (typeof LESSON_VIDEO_ID !== 'undefined' && LESSON_VIDEO_ID && LESSON_VIDEO_ID.trim() !== '') ? 'intro-video' : 'intro-infographic';
        let currentZoom = 100;
        let isAdvancedUnlocked = false;
        let isSidebarCollapsed = false;
        let viewedPages = new Set();
        let flippedCards = new Set();
        let userAnswers = {};

        const STORAGE_KEY = 'kv_elearning_v21_' + (window.location.pathname || 'gui_tin_cskh_zns').replace(/[^a-zA-Z0-9_-]/g, '_');

        function loadProgressState() {
            try {
                const raw = sessionStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);
                if (Array.isArray(data.viewed)) data.viewed.forEach(p => viewedPages.add(p));
                if (Array.isArray(data.flipped)) data.flipped.forEach(k => flippedCards.add(k));
                if (data.answers && typeof data.answers === 'object') userAnswers = data.answers;
            } catch (e) {}
        }

        function saveProgressState() {
            try {
                const data = {
                    viewed: Array.from(viewedPages),
                    flipped: Array.from(flippedCards),
                    answers: userAnswers
                };
                sessionStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {}
        }

        function isPageCompleted(pageId) {
            if (!pageId) return false;
            if (pageId.startsWith('intro-')) {
                return viewedPages.has(pageId);
            }
            if (pageId.startsWith('basic-') || pageId.startsWith('advanced-')) {
                const parts = pageId.split('-');
                const scope = parts[0];
                const idx = parts[1];
                const ans = userAnswers[`${scope}_${idx}`];
                const isQuizCorrect = Boolean(ans && ans.isCorrect === true);
                const isCardFlipped = flippedCards.has(pageId);
                return isCardFlipped && isQuizCorrect;
            }
            return false;
        }

        function getBasicCompletionStats() {
            const total = (typeof BASIC_LESSONS !== 'undefined') ? BASIC_LESSONS.length : 0;
            let completed = 0;
            let firstIncompleteId = null;
            let firstIncompleteTitle = '';
            for (let i = 0; i < total; i++) {
                const pid = `basic-${i}`;
                if (isPageCompleted(pid)) {
                    completed++;
                } else if (!firstIncompleteId) {
                    firstIncompleteId = pid;
                    firstIncompleteTitle = BASIC_LESSONS[i].title;
                }
            }
            return { completed, total, isAllCompleted: (total > 0 && completed === total), firstIncompleteId, firstIncompleteTitle };
        }

        function isMobile() {
            return window.innerWidth < 768;
        }

        function getLinearNavigationList() {
            let list = [];

            if (typeof LESSON_VIDEO_ID !== 'undefined' && LESSON_VIDEO_ID && LESSON_VIDEO_ID.trim() !== '') {
                list.push({ id: 'intro-video', title: 'Video hướng dẫn' });
            }

            list.push({ id: 'intro-infographic', title: 'Infographic' });
            list.push({ id: 'intro-overview', title: 'Lợi ích nổi bật' });
            list.push({ id: 'intro-glossary', title: 'Thuật ngữ nền tảng' });

            if (typeof BASIC_LESSONS !== 'undefined') {
                BASIC_LESSONS.forEach((l, idx) => {
                    list.push({ id: `basic-${idx}`, title: l.title, scope: 'basic', index: idx });
                });
            }

            if (typeof isAdvancedUnlocked !== 'undefined' && isAdvancedUnlocked && typeof ADVANCED_LESSONS !== 'undefined') {
                ADVANCED_LESSONS.forEach((l, idx) => {
                    list.push({ id: `advanced-${idx}`, title: l.title, scope: 'advanced', index: idx });
                });
            }
            return list;
        }

        document.addEventListener("DOMContentLoaded", function() {
            loadProgressState();
            applyStateFromHash(true);
            window.addEventListener('hashchange', function() {
                applyStateFromHash(false);
            });
            window.addEventListener('keydown', function(e) {
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
                const lb = document.getElementById('image-lightbox-modal');
                if (e.key === 'Escape') {
                    if (lb && !lb.classList.contains('hidden')) {
                        closeImageLightbox();
                        return;
                    }
                    closeModal('modal-basic-complete');
                    closeModal('modal-advanced-complete');
                    return;
                }
                if (lb && !lb.classList.contains('hidden')) return;
                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    navStepLinear('next');
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    navStepLinear('prev');
                }
            });
        });

        function openImageLightbox(src, caption) {
            const modal = document.getElementById('image-lightbox-modal');
            const img = document.getElementById('lightbox-img-target');
            const cap = document.getElementById('lightbox-img-caption');
            if (!modal || !img) return;
            img.src = src;
            if (cap) {
                cap.textContent = caption || 'Hình ảnh minh họa giao diện KiotViet';
                cap.classList.toggle('hidden', !caption);
            }
            modal.classList.remove('hidden');
        }

        function closeImageLightbox() {
            const modal = document.getElementById('image-lightbox-modal');
            if (modal) modal.classList.add('hidden');
        }

        function syncStateToHash() {
            const parts = [];
            parts.push(currentZoom);
            parts.push(isAdvancedUnlocked ? 'nc' : 'cb');
            const newHash = '#' + parts.join('&');
            if (window.location.hash !== newHash) {
                try {
                    if (window.location.protocol === 'file:') {
                        window.location.hash = newHash;
                    } else {
                        history.replaceState(null, '', newHash);
                    }
                } catch(e) {
                    try { window.location.hash = newHash; } catch(err) {}
                }
            }
        }

        function applyStateFromHash(isInitial = false) {
            const rawHash = (window.location.hash || '').replace(/^#/, '').toLowerCase().trim();

            let targetZoom = 100;
            const zoomMatch = rawHash.match(/\b(70|80|90|100|120|150)\b/) || rawHash.match(/(?:zoom[=:]?|z)(\d{2,3})/);
            if (zoomMatch) {
                const zVal = parseInt(zoomMatch[1], 10);
                if ([70, 80, 90, 100, 120, 150].includes(zVal)) {
                    targetZoom = zVal;
                }
            }
            setAppZoom(targetZoom, false);

            let targetAdv = false;
            if (/\b(nc|adv|advanced|nangcao|full|all)\b/.test(rawHash) || /adv(?:anced)?=(?:1|true)/.test(rawHash)) {
                targetAdv = true;
            }
            handleAdvancedToggle(targetAdv, false);

            const pageMatch = rawHash.match(/(intro-(?:video|infographic|overview|glossary)|basic-\d+|advanced-\d+)/);
            if (pageMatch) {
                navGoToPage(pageMatch[1]);
            } else if (isInitial) {
                const defaultPage = (typeof LESSON_VIDEO_ID !== 'undefined' && LESSON_VIDEO_ID && LESSON_VIDEO_ID.trim() !== '') ? 'intro-video' : 'intro-infographic';
                navGoToPage(defaultPage);
            }
        }

        function stepZoom(delta) {
            const levels = [70, 80, 90, 100, 120, 150];
            let idx = levels.indexOf(currentZoom);
            if (idx === -1) idx = levels.indexOf(100);
            const nextIdx = Math.max(0, Math.min(levels.length - 1, idx + delta));
            setAppZoom(levels[nextIdx]);
        }

        function showAdvTooltip(targetEl) {
            const tip = document.getElementById('adv-cluster-tooltip');
            if (!tip) return;
            const sidebar = document.getElementById('app-sidebar');
            const targetRect = targetEl.getBoundingClientRect();
            const sidebarRect = sidebar ? sidebar.getBoundingClientRect() : targetRect;
            
            tip.classList.remove('hidden');

            if (window.innerWidth < 640) {
                tip.style.left = '16px';
                tip.style.right = '16px';
                tip.style.width = 'auto';
                tip.style.top = (targetRect.bottom + 8) + 'px';
            } else {
                tip.style.width = '18rem';
                tip.style.right = 'auto';
                const leftPos = Math.max(sidebarRect.right, targetRect.right) + 12;
                tip.style.left = leftPos + 'px';
                const tipHeight = tip.offsetHeight || 80;
                let topPos = targetRect.top + (targetRect.height / 2) - (tipHeight / 2);
                if (topPos + tipHeight > window.innerHeight - 20) {
                    topPos = window.innerHeight - tipHeight - 20;
                }
                tip.style.top = Math.max(10, topPos) + 'px';
            }
        }

        function hideAdvTooltip() {
            const tip = document.getElementById('adv-cluster-tooltip');
            if (tip) tip.classList.add('hidden');
        }

        function setAppZoom(val, syncHash = true) {
            currentZoom = val;
            const fontMap = {
                70: '11.5px',
                80: '13px',
                90: '14.5px',
                100: '16px',
                120: '19.2px',
                150: '24px'
            };
            document.documentElement.style.fontSize = fontMap[val] || '16px';

            const zoomOutBtn = document.getElementById('nav-zoom-out-btn');
            const zoomInBtn = document.getElementById('nav-zoom-in-btn');
            if (zoomOutBtn) {
                zoomOutBtn.disabled = (val <= 70);
            }
            if (zoomInBtn) {
                zoomInBtn.disabled = (val >= 150);
            }

            if (syncHash) syncStateToHash();
        }

        function handleAdvancedToggle(checked, syncHash = true) {
            isAdvancedUnlocked = checked;
            const contentEl = document.getElementById('sidebar-advanced-content');
            const sidebarToggle = document.getElementById('sidebar-advanced-toggle');
            if (sidebarToggle) sidebarToggle.checked = checked;

            if (checked) {
                if (contentEl) contentEl.classList.remove('hidden');
            } else {
                if (contentEl) contentEl.classList.add('hidden');
                if (currentPage && currentPage.startsWith('advanced-')) {
                    navGoToPage('basic-0');
                }
            }
            renderSidebar();
            renderCurrentPageView();
            updateSideNavButtons();
            if (syncHash) syncStateToHash();
        }

        function toggleSidebarCollapse() {
            const sidebar = document.getElementById('app-sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            const icon = document.getElementById('sidebar-toggle-icon');

            if (isMobile()) {
                const isOpen = !sidebar.classList.contains('-translate-x-full');
                if (isOpen) {
                    sidebar.classList.add('-translate-x-full');
                    backdrop.classList.add('hidden');
                    icon.className = 'fa-solid fa-bars-staggered text-xs';
                } else {
                    sidebar.classList.remove('-translate-x-full');
                    backdrop.classList.remove('hidden');
                    icon.className = 'fa-solid fa-xmark text-xs';
                }
            } else {
                isSidebarCollapsed = !isSidebarCollapsed;
                if (isSidebarCollapsed) {
                    sidebar.style.width = '0px';
                    sidebar.style.minWidth = '0px';
                    sidebar.style.transform = 'translateX(-100%)';
                    sidebar.style.opacity = '0';
                    icon.className = 'fa-solid fa-arrow-right-to-bracket text-xs';
                } else {
                    sidebar.style.width = '';
                    sidebar.style.minWidth = '';
                    sidebar.style.transform = 'translateX(0)';
                    sidebar.style.opacity = '1';
                    icon.className = 'fa-solid fa-bars-staggered text-xs';
                }
            }
        }

        function toggleAdvChildGroup(sub) {
            const p = document.getElementById(`panel-adv-${sub}`);
            const icon = document.getElementById(`icon-adv-${sub}`);
            if (p && icon) {
                p.classList.toggle('hidden');
                icon.style.transform = p.classList.contains('hidden') ? 'rotate(-90deg)' : 'rotate(0deg)';
            }
        }

        function updateSideNavButtons() {
            const list = getLinearNavigationList();
            const curIdx = list.findIndex(item => item.id === currentPage);
            const prevBtn = document.getElementById('nav-btn-prev');
            const nextBtn = document.getElementById('nav-btn-next');
            if (!prevBtn || !nextBtn) return;

            if (curIdx <= 0) {
                prevBtn.disabled = true;
                prevBtn.classList.add('opacity-0', 'pointer-events-none');
            } else {
                prevBtn.disabled = false;
                prevBtn.classList.remove('opacity-0', 'pointer-events-none');
            }
        }

        function navGoToPage(pageId) {
            if (pageId === 'intro-video' && (!LESSON_VIDEO_ID || LESSON_VIDEO_ID.trim() === '')) {
                pageId = 'intro-infographic';
            }
            currentPage = pageId;
            viewedPages.add(pageId);
            saveProgressState();
            renderSidebar();
            renderCurrentPageView();
            updateSideNavButtons();
            
            if (isMobile()) {
                const sidebar = document.getElementById('app-sidebar');
                const backdrop = document.getElementById('sidebar-backdrop');
                const icon = document.getElementById('sidebar-toggle-icon');
                if (sidebar && backdrop && !sidebar.classList.contains('-translate-x-full')) {
                    sidebar.classList.add('-translate-x-full');
                    backdrop.classList.add('hidden');
                    icon.className = 'fa-solid fa-bars-staggered text-xs';
                }
            }

            const container = document.getElementById('dynamic-content-view');
            if (container) container.scrollTop = 0;
        }

        function navStepLinear(direction) {
            const list = getLinearNavigationList();
            const curIdx = list.findIndex(item => item.id === currentPage);
            if (curIdx === -1) return;

            if (direction === 'next') {
                if (curIdx === list.length - 1) {
                    if (!isAdvancedUnlocked) {
                        const m = document.getElementById('modal-basic-complete');
                        if (m) m.classList.remove('hidden');
                    } else {
                        const m = document.getElementById('modal-advanced-complete');
                        if (m) m.classList.remove('hidden');
                    }
                    return;
                }
                const nextItem = list[curIdx + 1];
                navGoToPage(nextItem.id);
            } else if (direction === 'prev') {
                if (curIdx > 0) {
                    const prevItem = list[curIdx - 1];
                    navGoToPage(prevItem.id);
                }
            }
        }

        function restartFromBeginning() {
            closeModal('modal-basic-complete');
            closeModal('modal-advanced-complete');
            const defaultPage = (typeof LESSON_VIDEO_ID !== 'undefined' && LESSON_VIDEO_ID && LESSON_VIDEO_ID.trim() !== '') ? 'intro-video' : 'intro-infographic';
            navGoToPage(defaultPage);

                            </div>
                            <div class="p-3.5 rounded-xl bg-white border border-slate-200 space-y-1 shadow-2xs">
                                <h3 class="text-xs sm:text-sm font-black text-blue-800">2. Tài khoản OA "MyKiot"</h3>
                                <p class="text-xs text-slate-600 leading-relaxed">Zalo Official Account tích hợp sẵn của KiotViet, cho phép các cửa hàng kích hoạt và gửi tin tức khuyến mại ngay mà không cần sở hữu giấy phép kinh doanh hay làm thủ tục xác thực Zalo phức tạp.</p>
                            </div>
                            <div class="p-3.5 rounded-xl bg-white border border-slate-200 space-y-1 shadow-2xs">
                                <h3 class="text-xs sm:text-sm font-black text-blue-800">3. Zalo OA của cửa hàng</h3>
                                <p class="text-xs text-slate-600 leading-relaxed">Tài khoản Zalo Official Account riêng của cửa hàng đã được Zalo xét duyệt xác thực doanh nghiệp, hiển thị trực tiếp thương hiệu riêng và hỗ trợ gửi tin định dạng Logo.</p>
                            </div>
                            <div class="p-3.5 rounded-xl bg-white border border-slate-200 space-y-1 shadow-2xs">
                                <h3 class="text-xs sm:text-sm font-black text-blue-800">4. Số dư tin nhắn &amp; Ví KiotCash</h3>
                                <p class="text-xs text-slate-600 leading-relaxed">Tài khoản thanh toán trả trước trên hệ thống KiotViet dùng để thanh toán cước phí gửi tin ZNS tự động theo thời gian thực và nhận tiền hoàn khi có lỗi gửi tin.</p>
                            </div>
                            <div class="p-3.5 rounded-xl bg-white border border-slate-200 space-y-1 shadow-2xs">
                                <h3 class="text-xs sm:text-sm font-black text-blue-800">5. Định dạng tin (Hình ảnh vs Logo)</h3>
                                <p class="text-xs text-slate-600 leading-relaxed">Hai định dạng mẫu tin ZNS: Định dạng Hình ảnh (gửi kèm banner ảnh minh họa ưu đãi, cước 660đ/tin) và Định dạng Logo (gửi kèm logo thương hiệu thu nhỏ, cước ưu đãi 330đ/tin sau khi duyệt logo).</p>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            // CHI TIẾT BÀI HỌC CƠ BẢN HOẶC NÂNG CAO
            let scope = '';
            let index = 0;
            if (currentPage.startsWith('basic-')) {
                scope = 'basic';
                index = parseInt(currentPage.split('-')[1]);
            } else if (currentPage.startsWith('advanced-')) {
                scope = 'advanced';
                index = parseInt(currentPage.split('-')[1]);
            }

            if (scope) {
                const lessons = (scope === 'basic') ? BASIC_LESSONS : ADVANCED_LESSONS;
                if (!lessons || !lessons[index]) return;
                const lesson = lessons[index];
                const scopeColor = (scope === 'basic') ? '#166def' : '#16a34a';
                const isLastBasicLesson = (scope === 'basic' && index === BASIC_LESSONS.length - 1);
                const pageId = `${scope}-${index}`;
                const savedAns = userAnswers[`${scope}_${index}`];

                const btnTrueClass = (savedAns && savedAns.userChoice === true)
                    ? (savedAns.isCorrect ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-rose-600 text-white border-rose-600 shadow-sm')
                    : 'bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border-emerald-300 shadow-2xs';

                const btnFalseClass = (savedAns && savedAns.userChoice === false)
                    ? (savedAns.isCorrect ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-rose-600 text-white border-rose-600 shadow-sm')
                    : 'bg-rose-50 hover:bg-rose-100 text-rose-800 border-rose-300 shadow-2xs';

                const feedbackHTML = savedAns ? `
                    <div id="quiz-feedback-${scope}-${index}" class="w-full mt-3 p-3 rounded-xl ${savedAns.isCorrect ? 'bg-emerald-50 border border-emerald-200 text-emerald-900' : 'bg-rose-50 border border-rose-200 text-rose-900'} space-y-1 text-left">
                        <p class="font-black text-xs flex items-center gap-1.5">
                            <i class="fa-solid ${savedAns.isCorrect ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-rose-600'}"></i>
                            ${savedAns.isCorrect ? 'CHÍNH XÁC!' : 'CHƯA CHÍNH XÁC!'}
                        </p>
                        <p class="text-[11px] sm:text-xs leading-relaxed text-slate-700">${lesson.quiz.explanation}</p>
                    </div>
                ` : `<div id="quiz-feedback-${scope}-${index}" class="hidden w-full mt-3 text-left"></div>`;

                container.innerHTML = `
                    <div class="w-full space-y-3.5 pb-20 md:pb-6">
                        <!-- TIÊU ĐỀ BÀI HỌC -->
                        <div class="space-y-1.5 border-b border-slate-200 pb-2.5">
                            <div class="flex flex-wrap items-center justify-between gap-2">
                                <span class="px-2.5 py-0.5 text-[10px] font-black text-white rounded-full uppercase tracking-wider" style="background-color: ${scopeColor}">
                                    ${scope === 'basic' ? 'Kiến thức cơ bản' : 'Kiến thức nâng cao'} - Thao tác ${index + 1}/${lessons.length}
                                </span>
                                <div id="lesson-header-status-${scope}-${index}">
                                    ${getLessonHeaderStatusHTML(pageId)}
                                </div>
                            </div>
                            <h2 class="text-base sm:text-lg font-black text-slate-900 flex items-center gap-2">
                                <span>${lesson.title}</span>
                            </h2>
                        </div>

                        <!-- TÌNH HUỐNG THỰC TẾ -->
                        <div class="p-3.5 sm:p-4 rounded-xl bg-gradient-to-r from-amber-50 via-orange-50/80 to-amber-50/50 border-2 border-amber-300 shadow-2xs space-y-1.5">
                            <div class="flex items-center gap-2 text-amber-900">
                                <div class="w-5 h-5 rounded-md bg-amber-500 text-white flex items-center justify-center text-[11px] shadow-xs shrink-0">
                                    <i class="fa-solid fa-lightbulb"></i>
                                </div>
                                <h3 class="text-xs font-black uppercase tracking-wider text-amber-900">Tình huống thực tế:</h3>
                            </div>
                            <p class="text-xs sm:text-sm text-amber-950 leading-relaxed font-medium pl-7">${lesson.situation}</p>
                        </div>

                        <!-- QUY TRÌNH THỰC HIỆN -->
                        <div class="space-y-3">
                            <h3 class="text-xs font-black uppercase tracking-wider text-slate-500">Quy trình thực hiện:</h3>
                            <div class="space-y-3">
                                ${lesson.steps.map((step, sIdx) => `
                                    <div class="space-y-1.5">
                                        <div class="flex items-start gap-2.5">
                                            <span class="w-5 h-5 rounded-full text-white text-[11px] font-black flex items-center justify-center shrink-0 mt-0.5 shadow-2xs" style="background-color: ${scopeColor}">${sIdx + 1}</span>
                                            <div class="text-xs sm:text-sm text-slate-700 leading-relaxed font-medium">${step.text}</div>
                                        </div>
                                        ${step.img ? `
                                            <div onclick="openImageLightbox('${step.img}', '${lesson.title.replace(/'/g, "\\\'")} - Bước ${sIdx + 1}')"
                                                 class="zoomable-img-wrap ml-7 rounded-xl overflow-hidden border border-slate-200 shadow-2xs bg-slate-100">
                                                <img src="${step.img}" alt="UI Step ${sIdx + 1}" class="w-full h-auto object-cover">
                                                <span class="zoom-hint-badge absolute bottom-2.5 right-2.5 px-2.5 py-1 rounded-full bg-slate-900/75 text-white text-[10px] font-bold flex items-center gap-1 shadow-md pointer-events-none">
                                                    <i class="fa-solid fa-magnifying-glass-plus"></i> Phóng to ảnh
                                                </span>
                                            </div>
                                        ` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- 1️⃣ GÓC TƯ VẤN BÁN HÀNG -->
                        <div class="pt-3 border-t border-slate-200 space-y-2">
                            <div class="flex flex-col sm:flex-row items-center justify-center gap-2 text-center">
                                <h3 class="text-xs font-black uppercase tracking-wider text-slate-500">Góc tư vấn bán hàng:</h3>
                                <div id="flashcard-status-${scope}-${index}">
                                    ${getFlashcardStatusPillHTML(pageId)}
                                </div>
                            </div>
                            
                            <div class="flashcard-3d-scene mx-auto max-w-lg w-full my-3 cursor-pointer select-none" onclick="toggleFlashcard3D(this)">
                                <div class="flashcard-3d-card">
                                    <!-- MẶT TRƯỚC -->
                                    <div class="flashcard-face bg-amber-50/95 border-2 border-amber-200 p-4 sm:p-6 shadow-xs flex flex-col justify-between gap-3">
                                        <div class="flex items-center justify-between text-amber-950 border-b border-amber-200/80 pb-2">
                                            <span class="text-xs font-black uppercase tracking-wider flex items-center gap-1.5 whitespace-nowrap">
                                                <i class="fa-solid fa-comments text-amber-600 text-sm"></i> Tình huống
                                            </span>
                                            <span class="text-[10px] font-bold bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-full flex items-center gap-1 uppercase shadow-2xs whitespace-nowrap shrink-0">
                                                Xem gợi ý <i class="fa-solid fa-rotate text-[9px]"></i>
                                            </span>
                                        </div>
                                        
                                        <div class="flex-1 flex items-center justify-center p-2">
                                            <p class="text-xs sm:text-sm text-slate-800 font-bold leading-relaxed text-center italic">"${lesson.flashcard.situation}"</p>
                                        </div>

                                        <div class="text-[10px] text-amber-700/80 text-center font-medium italic pt-1 border-t border-amber-200/50 whitespace-nowrap truncate">
                                            <i class="fa-solid fa-hand-pointer text-[9px] mr-1"></i> Bấm vào thẻ để lật xem gợi ý tư vấn
                                        </div>
                                    </div>

                                    <!-- MẶT SAU -->
                                    <div class="flashcard-face flashcard-face-back bg-teal-50/95 border-2 border-teal-200 p-4 sm:p-6 shadow-xs flex flex-col justify-between gap-3">
                                        <div class="flex items-center justify-between text-teal-950 border-b border-teal-200/80 pb-2">
                                            <span class="text-xs font-black uppercase tracking-wider flex items-center gap-1.5 whitespace-nowrap">
                                                <i class="fa-solid fa-lightbulb text-teal-600 text-sm"></i> Gợi ý tư vấn
                                            </span>
                                            <span class="text-[10px] font-bold bg-teal-100 text-teal-800 px-2.5 py-0.5 rounded-full flex items-center gap-1 uppercase shadow-2xs whitespace-nowrap shrink-0">
                                                Lật lại <i class="fa-solid fa-rotate text-[9px]"></i>
                                            </span>
                                        </div>

                                        <div class="flex-1 flex items-center justify-center p-2">
                                            <p class="text-[11px] sm:text-sm text-slate-800 font-semibold leading-relaxed text-left">${lesson.flashcard.advice}</p>
                                        </div>

                                        <div class="text-[10px] text-teal-700/80 text-center font-medium italic pt-1 border-t border-teal-200/50 whitespace-nowrap truncate">
                                            <i class="fa-solid fa-hand-pointer text-[9px] mr-1"></i> Bấm vào thẻ để quay lại tình huống
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 2️⃣ KIỂM TRA NHANH KIẾN THỨC -->
                        <div class="pt-3 border-t border-slate-200 space-y-2">
                            <div class="flex flex-col sm:flex-row items-center justify-center gap-2 text-center">
                                <h3 class="text-xs font-black uppercase tracking-wider text-slate-500">Kiểm tra nhanh kiến thức:</h3>
                                <div id="quiz-status-${scope}-${index}">
                                    ${getQuizStatusPillHTML(scope, index)}
                                </div>
                            </div>

                            <div class="mx-auto max-w-lg w-full min-h-[210px] h-auto my-3 p-4 sm:p-6 rounded-2xl bg-white border-2 border-slate-200 shadow-xs flex flex-col justify-between gap-3 select-none">
                                <div class="flex items-center justify-between text-slate-800 border-b border-slate-100 pb-2">
                                    <span class="text-xs font-black uppercase tracking-wider flex items-center gap-1.5 whitespace-nowrap" style="color: ${scopeColor}">
                                        <i class="fa-solid fa-circle-question text-sm"></i> Câu hỏi
                                    </span>
                                    <span class="text-[10px] font-bold bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full uppercase whitespace-nowrap shrink-0">
                                        Đúng / Sai
                                    </span>
                                </div>

                                <div class="flex-1 flex flex-col justify-center items-center py-2 text-center">
                                    <p class="text-xs sm:text-sm text-slate-800 font-bold leading-relaxed">${lesson.quiz.question}</p>
                                    ${feedbackHTML}
                                </div>

                                <div class="flex items-center gap-2.5 sm:gap-3 pt-2 border-t border-slate-100">
                                    <button id="btn-quiz-${scope}-${index}-true" onclick="checkQuiz('${scope}', ${index}, true)" class="flex-1 py-2 sm:py-2.5 px-2 rounded-xl font-black text-xs border-2 transition-all cursor-pointer ${btnTrueClass}">
                                        ✓ ĐÚNG
                                    </button>
                                    <button id="btn-quiz-${scope}-${index}-false" onclick="checkQuiz('${scope}', ${index}, false)" class="flex-1 py-2 sm:py-2.5 px-2 rounded-xl font-black text-xs border-2 transition-all cursor-pointer ${btnFalseClass}">
                                        ✕ SAI
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- 3️⃣ BANNER FULL-WIDTH CHÚC MỪNG HOÀN THÀNH -->
                        ${isLastBasicLesson ? `
                            <div id="basic-completion-banner-wrap" class="pt-5 sm:pt-6">
                                ${getBasicCompletionBannerHTML()}
                            </div>
                        ` : ''}

                    </div>
                `;
            }
        }

        function toggleFlashcard3D(sceneEl) {
            const cardEl = sceneEl ? sceneEl.querySelector('.flashcard-3d-card') : null;
            if (cardEl) cardEl.classList.toggle('is-flipped');

            if (currentPage && (currentPage.startsWith('basic-') || currentPage.startsWith('advanced-'))) {
                flippedCards.add(currentPage);
                saveProgressState();
                const parts = currentPage.split('-');
                updateLiveLessonCompletionUI(parts[0], parseInt(parts[1], 10));
            }
        }

        function checkQuiz(scope, index, choice) {
            const lessons = scope === 'basic' ? BASIC_LESSONS : ADVANCED_LESSONS;
            if (!lessons || !lessons[index]) return;
            const lesson = lessons[index];
            const isCorrect = (choice === lesson.quiz.answer);
            userAnswers[`${scope}_${index}`] = { userChoice: choice, isCorrect: isCorrect };
            saveProgressState();

            const btnTrue = document.getElementById(`btn-quiz-${scope}-${index}-true`);
            const btnFalse = document.getElementById(`btn-quiz-${scope}-${index}-false`);
            if (btnTrue && btnFalse) {
                const baseBtn = 'flex-1 py-2 sm:py-2.5 px-2 rounded-xl font-black text-xs border-2 transition-all cursor-pointer ';
                if (choice === true) {
                    btnTrue.className = baseBtn + (isCorrect ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-rose-600 text-white border-rose-600 shadow-sm');
                    btnFalse.className = baseBtn + 'bg-rose-50 hover:bg-rose-100 text-rose-800 border-rose-300 shadow-2xs';
                } else {
                    btnFalse.className = baseBtn + (isCorrect ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-rose-600 text-white border-rose-600 shadow-sm');
                    btnTrue.className = baseBtn + 'bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border-emerald-300 shadow-2xs';
                }
            }

            const feedbackEl = document.getElementById(`quiz-feedback-${scope}-${index}`);
            if (feedbackEl) {
                feedbackEl.className = `w-full mt-3 p-3 rounded-xl ${isCorrect ? 'bg-emerald-50 border border-emerald-200 text-emerald-900' : 'bg-rose-50 border border-rose-200 text-rose-900'} space-y-1 block text-left`;
                feedbackEl.innerHTML = `
                    <p class="font-black text-xs flex items-center gap-1.5">
                        <i class="fa-solid ${isCorrect ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-rose-600'}"></i>
                        ${isCorrect ? 'CHÍNH XÁC!' : 'CHƯA CHÍNH XÁC!'}
                    </p>
                    <p class="text-[11px] sm:text-xs leading-relaxed text-slate-700">${lesson.quiz.explanation}</p>
                `;
            }

            updateLiveLessonCompletionUI(scope, index);
        }

        function closeModal(id) { 
            const el = document.getElementById(id);
            if (el) el.classList.add('hidden'); 
        }

    </script>
</body>
</html>
