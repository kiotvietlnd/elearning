<!DOCTYPE html>
<html lang="vi" class="scroll-smooth h-full">
<head> 
    <link class="icon" type="image/png" href="https://cdn-kvweb.kiotviet.vn/kiotviet-website/wp-content/uploads/2023/10/31095822/64x64.png" sizes="64x64">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Ôn Tập Tình Huống Tư Vấn Tính Năng Sản Phẩm KiotViet FNB</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { 
                extend: {
                    colors: {
                        kvBlue: '#166def',
                        kvBlueHover: '#1259c7',
                        themeAccent: '#14b8a6',
                        themeAccentHover: '#0d9488'
                    }
                } 
            }
        }
    </script>
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; font-size: 14px; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        @media (min-width: 1024px) { html, body { overflow: hidden; } }

        .tech-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -10; background-color: #f0f4f8; overflow: hidden; }
        .glow-blob-1, .glow-blob-2 { position: absolute; width: 50vw; height: 50vw; filter: blur(120px); border-radius: 50%; transition: background 1.5s ease-in-out; }
        .glow-blob-1 { top: -10%; left: -10%; background: radial-gradient(circle, rgba(30, 58, 138, 0.15) 0%, rgba(30, 58, 138, 0) 70%); } 
        .glow-blob-2 { bottom: -10%; right: -10%; background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, rgba(14, 165, 233, 0) 70%); }
        
        .glass-panel-ultra { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(20px) saturate(180%); 
            -webkit-backdrop-filter: blur(20px) saturate(180%); 
            border: 1px solid rgba(255, 255, 255, 0.6); 
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05); 
        }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; } 
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar { display: none; } 
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-700 antialiased selection:bg-teal-100 selection:text-teal-900 flex flex-col h-screen bg-[#f0f4f8] overflow-hidden">

    <!-- TECH BACKGROUND -->
    <div class="tech-bg">
        <div class="glow-blob-1" id="blob-1"></div>
        <div class="glow-blob-2" id="blob-2"></div>
    </div>

    <!-- HEADER NAVIGATION (Chiều cao h-[72px] Gradient KiotViet E-Learning) -->
    <header class="h-[72px] shrink-0 text-white shadow-md z-30 flex items-center" style="background: linear-gradient(135deg, #166def 0%, #166def 75%, #ffffff 85%, #14b8a6 100%);">
        <div class="w-full mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <button onclick="window.toggleSidebar()" class="lg:hidden w-10 h-10 rounded-full hover:bg-white/10 flex items-center justify-center text-white text-lg shrink-0 transition-colors">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <a href="https://kiotvietlnd.github.io/elearning/" class="shrink-0 select-none bg-white p-1.5 rounded-lg flex items-center shadow-sm">
                    <img src="https://logo.kiotviet.vn/KiotViet-Logo-Horizontal.svg" alt="KiotViet Logo" class="h-5">
                </a>
                <div class="hidden md:block border-l border-white/20 pl-3">
                    <h1 class="text-sm font-bold tracking-tight text-white uppercase">TRANG ÔN TẬP TÌNH HUỐNG TƯ VẤN TÍNH NĂNG SẢN PHẨM KIOTVIET FNB</h1>
                    <p class="text-[11px] text-white/80 font-bold tracking-wider uppercase">Dành cho Chuyên viên Kinh doanh KiotViet FNB</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <a href="https://kiotvietlnd.github.io/elearning/khoa-hoc-tai-ky/" target="_blank" class="bg-white/10 hover:bg-white/20 text-white border border-white/20 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-book-open text-xs"></i>
                    <span class="hidden sm:inline">Học liệu Tái ký</span>
                </a>
            </div>
        </div>
    </header>

    <main class="flex flex-1 overflow-hidden relative">
        
        <!-- MAIN WORKSPACE (BÊN TRÁI) -->
        <div id="main-scroll-area" class="flex-1 overflow-y-auto px-4 md:px-8 py-6 pb-20 relative bg-transparent custom-scroll">
            
            <!-- MENU CHỌN NGÀY HỌC -->
            <div class="flex justify-start mb-6 flex-shrink-0">
                <div class="flex w-full max-w-md gap-2 bg-white/80 p-1.5 rounded-2xl border border-slate-200 shadow-sm backdrop-blur">
                    <button onclick="switchSubTab('day1')" id="sub-tab-day1" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all bg-emerald-500 text-white shadow-md flex items-center justify-center gap-1.5"><i class="fa-solid fa-calendar-day"></i> NGÀY 1</button>
                    <button onclick="switchSubTab('day2')" id="sub-tab-day2" class="flex-1 py-2 text-xs font-bold rounded-xl text-slate-600 hover:text-slate-800 hover:bg-slate-100 transition-all flex items-center justify-center gap-1.5"><i class="fa-solid fa-calendar-day"></i> NGÀY 2</button>
                    <button onclick="switchSubTab('day3')" id="sub-tab-day3" class="flex-1 py-2 text-xs font-bold rounded-xl text-slate-600 hover:text-slate-800 hover:bg-slate-100 transition-all flex items-center justify-center gap-1.5"><i class="fa-solid fa-calendar-day"></i> NGÀY 3</button>
                </div>
            </div>

            <!-- KHU VỰC TÌNH HUỐNG CHÍNH -->
            <div class="glass-panel-ultra rounded-2xl p-5 md:p-6 shadow-sm border border-slate-200/80 mb-6 flex flex-col gap-4">
                
                <!-- TIÊU ĐỀ PHIÊN HỌC -->
                <div class="flex items-center justify-between border-b pb-3 border-slate-200/80">
                    <div class="flex items-center gap-3">
                        <span class="w-9 h-9 rounded-xl bg-blue-50 text-kvBlue border border-blue-200 flex items-center justify-center text-base shrink-0 shadow-sm" id="session-header-icon"><i class="fa-solid fa-utensils"></i></span>
                        <h2 class="text-xs font-black text-slate-800 tracking-tight uppercase" id="session-header-title">PHIÊN 1: KIẾN THỨC FNB NỀN TẢNG</h2>
                    </div>
                </div>

                <!-- Ô TÌM KIẾM NHANH TÌNH HUỐNG -->
                <div class="relative">
                    <input type="text" id="searchScenarioInput" onkeyup="filterAllScenarios(this.value)" placeholder="🔍 Tìm nhanh tình huống theo tên, từ khóa..." class="w-full text-xs pl-9 pr-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-kvBlue/30 bg-white shadow-sm transition-all text-slate-800 placeholder:text-slate-400">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                </div>

                <!-- DANH SÁCH TÌNH HUỐNG (ACCORDION) -->
                <div id="scenarios-checkbox-list" class="space-y-3 pt-1">
                    <!-- JS Render danh sách câu hỏi -->
                </div>
            </div>
        </div>

        <!-- SIDEBAR DANH SÁCH BÀI HỌC (NẰM BÊN PHẢI - CHIỀU RỘNG 320px) -->
        <aside class="hidden lg:flex flex-col w-[320px] shrink-0 border-l border-white/10 bg-[#1e3a8a] text-white relative z-20 shadow-lg">
            <div class="p-4 border-b border-white/10 bg-[#172554] flex items-center gap-2.5 shrink-0">
                <span class="w-7 h-7 rounded-lg bg-white/10 text-sky-300 flex items-center justify-center"><i class="fa-solid fa-layer-group text-xs"></i></span>
                <h3 class="text-xs font-bold text-white uppercase tracking-wider">Danh sách bài học</h3>
            </div>
            
            <div id="lesson-sidebar-list" class="flex-grow overflow-y-auto custom-scroll p-4 space-y-4">
                <!-- JS Render danh sách bài học -->
            </div>
        </aside>

    </main>

    <!-- BOTTOM BAR PHỤ SÁNG MÀU (Chiều cao h-12) -->
    <div class="h-12 shrink-0 bg-white/95 backdrop-blur border-t border-slate-200 px-3 sm:px-6 flex items-center justify-between z-30 shadow-md text-xs font-medium text-slate-600">
        <div class="flex items-center gap-2 sm:gap-4 overflow-x-auto no-scrollbar py-1">
            <span class="flex items-center gap-1.5 text-slate-700 font-bold"><i class="fa-solid fa-circle-info text-kvBlue"></i> Hỗ trợ học tập:</span>
            <a href="https://kiotvietlnd.github.io/elearning/khoa-hoc-tai-ky/" target="_blank" class="hover:text-kvBlue underline flex items-center gap-1 font-semibold text-slate-700 whitespace-nowrap"><i class="fa-solid fa-book-bookmark text-xs"></i> Trang Học liệu Tái ký</a>
            <a href="https://kiotviet.vn/ho-tro" target="_blank" class="hover:text-kvBlue underline flex items-center gap-1 font-semibold text-slate-700 whitespace-nowrap"><i class="fa-solid fa-circle-question text-xs"></i> Trang Hỗ trợ KiotViet</a>
        </div>
        <div class="hidden sm:flex items-center gap-2 text-slate-500 font-bold text-[11px]">
            <span>© 2026 KiotViet Learning & Development</span>
        </div>
    </div>

    <!-- MOBILE SIDEBAR -->
    <div id="mobile-sidebar" class="fixed inset-y-0 right-0 w-[280px] bg-[#1e3a8a] text-white z-50 transform translate-x-full transition-transform duration-300 ease-in-out lg:hidden flex flex-col shadow-2xl">
        <div class="p-4 border-b border-white/10 flex items-center justify-between shrink-0 bg-[#172554]">
            <span class="text-xs font-bold tracking-tight uppercase flex items-center gap-2"><i class="fa-solid fa-layer-group text-sky-300"></i> Danh sách bài học</span>
            <button onclick="window.toggleSidebar()" class="w-8 h-8 rounded-full hover:bg-white/10 flex items-center justify-center text-white">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>
        <div id="mobile-lesson-sidebar-list" class="flex-grow overflow-y-auto custom-scroll p-4 space-y-4"></div>
    </div>

    <script src="codelab-data.js"></script>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzZwkUV8g79PfYExma-7WRFg7IRY2fWmjpb63XiHqu6cqzx03uYi8Wmul9SamvyM9FMgQ/exec"; 
        const SECURITY_TOKEN = "KIOT_RENEWAL_Q3_2026";

        let scenariosData = {};
        let currentDay = 'day1';
        const currentRoadmap = 'FNB'; // Khóa mặc định là FNB
        let currentSelectedLesson = null;

        window.onload = function() { loadScenariosFromSheet(); };

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('mobile-sidebar');
            if (sidebar) sidebar.classList.toggle('translate-x-full');
        };

        function loadScenariosFromSheet() {
            fetch(`${API_URL}?token=${SECURITY_TOKEN}&action=getScenarios`)
            .then(res => res.json())
            .then(response => {
                if (response.status === "success" && response.data && response.data.length > 0) {
                    scenariosData = { day1: [], day2: [], day3: [] };
                    response.data.forEach(item => {
                        if (!item.Day || item.Day.toString().trim().toLowerCase() === "day") return; 
                        const dayKey = item.Day.toString().trim();
                        if (scenariosData[dayKey]) {
                            scenariosData[dayKey].push({
                                id: item.id || Math.random(), type: item.Type ? item.Type.toString().trim() : "",
                                title: item.Title, question: item.Question, answer: item.Answer,
                                roadmap: item.Roadmap ? item.Roadmap.toString().trim() : "" 
                            });
                        }
                    });
                    switchSubTab('day1');
                }
            });
        }

        // ================= ĐỊNH DẠNG & TRÍCH XUẤT TIÊU ĐỀ =================
        function splitTitle(fullTitle) {
            if (!fullTitle) return { code: "", lesson: "", scenario: "" };
            let code = "", lesson = "", scenario = "";
            const dashIndex = fullTitle.indexOf(" - ");
            if (dashIndex !== -1) {
                code = fullTitle.substring(0, dashIndex).trim();
                const rest = fullTitle.substring(dashIndex + 3).trim();
                const colonIndex = rest.indexOf(": ");
                if (colonIndex !== -1) {
                    lesson = rest.substring(0, colonIndex).trim();
                    scenario = rest.substring(colonIndex + 2).trim();
                } else scenario = rest;
            } else scenario = fullTitle;
            return { code, lesson, scenario };
        }

        function formatQuestionText(text) {
            if (!text) return "";
            let cleanText = text.replace(/\r\n/g, ' ').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
            return escapeHtml(cleanText);
        }

        function escapeHtml(string) {
            if (!string) return "";
            return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ================= ĐIỀU HƯỚNG UI =================
        function switchSubTab(day) {
            currentDay = day;
            
            ['day1', 'day2', 'day3'].forEach(item => {
                const button = document.getElementById(`sub-tab-${item}`);
                if (button) {
                    if (item === day) {
                        button.classList.add('bg-emerald-500', 'text-white', 'shadow-md');
                        button.classList.remove('text-slate-600');
                    } else {
                        button.classList.remove('bg-emerald-500', 'text-white', 'shadow-md');
                        button.classList.add('text-slate-600');
                    }
                }
            });

            const headerTitle = document.getElementById('session-header-title');
            if (day === 'day1') headerTitle.textContent = "PHIÊN 1: KIẾN THỨC FNB NỀN TẢNG";
            else if (day === 'day2') headerTitle.textContent = "PHIÊN 2: BÁN HÀNG NÂNG CAO & QUẢN TRỊ ĐA KÊNH";
            else if (day === 'day3') headerTitle.textContent = "PHIÊN 3: PHÁP LÝ THUẾ & KẾ TOÁN HỘ KINH DOANH";

            currentSelectedLesson = null;
            renderLessonSidebar();
        }

        // ================= XỬ LÝ SIDEBAR BÀI HỌC =================
        function renderLessonSidebar() {
            const list = scenariosData[currentDay] ? scenariosData[currentDay].filter(item => item.roadmap === currentRoadmap) : [];
            const sidebar = document.getElementById('lesson-sidebar-list');
            const mobileSidebar = document.getElementById('mobile-lesson-sidebar-list');
            
            if (!list || list.length === 0) { 
                const emptyMsg = '<p class="text-xs p-3 text-sky-200/60 text-center italic">Chưa có bài học</p>';
                if (sidebar) sidebar.innerHTML = emptyMsg; 
                if (mobileSidebar) mobileSidebar.innerHTML = emptyMsg; 
                renderScenariosCheckboxList();
                return; 
            }

            const morningMap = new Map();
            const afternoonMap = new Map();

            list.forEach(item => {
                const parts = splitTitle(item.title);
                const lessonName = parts.lesson || "Chưa phân loại";
                if (item.type === 'morning') {
                    morningMap.set(lessonName, (morningMap.get(lessonName) || 0) + 1);
                } else {
                    afternoonMap.set(lessonName, (afternoonMap.get(lessonName) || 0) + 1);
                }
            });

            let html = "";
            if (morningMap.size > 0) {
                html += `<div class="mb-3"><span class="text-[10px] font-black text-amber-300 uppercase tracking-wider block mb-1.5"><i class="fa-solid fa-sun mr-1"></i> HỌC PHẦN SÁNG</span><div class="space-y-1">`;
                morningMap.forEach((count, name) => {
                    const isActive = (name === currentSelectedLesson);
                    const activeCss = isActive ? "bg-white/20 text-white font-bold border-l-4 border-sky-400 shadow-sm" : "text-sky-200/80 hover:bg-white/10 hover:text-white border-l-0";
                    html += `<button type="button" onclick="selectLesson('${escapeHtml(name)}')" class="w-full text-left px-3 py-2 rounded-xl border-y border-transparent text-xs font-semibold leading-tight transition-all block ${activeCss}">${escapeHtml(name)} <span class="opacity-60 text-[10px]">(${count})</span></button>`;
                });
                html += `</div></div>`;
            }

            if (afternoonMap.size > 0) {
                html += `<div><span class="text-[10px] font-black text-sky-300 uppercase tracking-wider block mb-1.5"><i class="fa-solid fa-moon mr-1"></i> HỌC PHẦN CHIỀU</span><div class="space-y-1">`;
                afternoonMap.forEach((count, name) => {
                    const isActive = (name === currentSelectedLesson);
                    const activeCss = isActive ? "bg-white/20 text-white font-bold border-l-4 border-sky-400 shadow-sm" : "text-sky-200/80 hover:bg-white/10 hover:text-white border-l-0";
                    html += `<button type="button" onclick="selectLesson('${escapeHtml(name)}')" class="w-full text-left px-3 py-2 rounded-xl border-y border-transparent text-xs font-semibold leading-tight transition-all block ${activeCss}">${escapeHtml(name)} <span class="opacity-60 text-[10px]">(${count})</span></button>`;
                });
                html += `</div></div>`;
            }
            
            if (sidebar) sidebar.innerHTML = html;
            if (mobileSidebar) mobileSidebar.innerHTML = html;

            if (!currentSelectedLesson) {
                const firstLesson = morningMap.keys().next().value || afternoonMap.keys().next().value;
                if (firstLesson) selectLesson(firstLesson);
                else renderScenariosCheckboxList();
            } else {
                renderScenariosCheckboxList();
            }
        }

        function selectLesson(lessonName) {
            currentSelectedLesson = lessonName;
            renderLessonSidebar();
            const sidebar = document.getElementById('mobile-sidebar');
            if (sidebar && !sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.add('translate-x-full');
            }
        }

        // ================= XỬ LÝ DANH SÁCH TÌNH HUỐNG (ACCORDION) =================
        function renderScenariosCheckboxList() {
            const container = document.getElementById('scenarios-checkbox-list');
            let list = scenariosData[currentDay] ? scenariosData[currentDay].filter(item => item.roadmap === currentRoadmap) : [];
            
            if (currentSelectedLesson) {
                list = list.filter(item => {
                    const parts = splitTitle(item.title);
                    return (parts.lesson || "Chưa phân loại") === currentSelectedLesson;
                });
            }

            if (!list || list.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 py-8 text-center italic">Không có tình huống thuộc bài học này.</p>`;
                return;
            }

            container.innerHTML = list.map((item) => {
                const parts = splitTitle(item.title);
                const questionHtml = formatQuestionText(item.question);

                return `
                    <div class="scenario-card border border-slate-200/80 rounded-2xl bg-white hover:border-blue-300 transition-all overflow-hidden shadow-xs" data-search="${escapeHtml((item.title + ' ' + item.question).toLowerCase())}">
                        <!-- Tiêu đề Accordion -->
                        <div onclick="toggleAccordion(this)" class="flex items-center justify-between cursor-pointer p-4 select-none">
                            <div class="pr-3">
                                <span class="text-[10px] font-black text-kvBlue tracking-wide block uppercase mb-0.5">${escapeHtml(parts.code || '')}</span>
                                <h4 class="text-xs sm:text-sm font-bold text-slate-800 transition-colors leading-snug">${escapeHtml(parts.scenario || item.title)}</h4>
                            </div>
                            <div class="shrink-0">
                                <i class="fa-solid fa-chevron-down text-slate-400 text-xs transition-transform duration-200 accordion-icon"></i>
                            </div>
                        </div>
                        
                        <!-- Nội dung tình huống (Mặc định ẩn) -->
                        <div class="scenario-content hidden border-t border-slate-100 p-4 bg-slate-50/70 rounded-b-2xl">
                            <div class="text-slate-700 leading-relaxed text-xs sm:text-sm">
                                <strong class="text-[10px] font-black uppercase text-slate-400 block mb-1">Tình huống ôn tập:</strong>
                                ${questionHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Logic điều khiển đóng mở Accordion
        function toggleAccordion(headerElement) {
            const card = headerElement.closest('.scenario-card');
            const content = card.querySelector('.scenario-content');
            const isAlreadyOpen = !content.classList.contains('hidden');

            document.querySelectorAll('.scenario-content').forEach(el => {
                if (el !== content) {
                    el.classList.add('hidden');
                    const otherCard = el.closest('.scenario-card');
                    otherCard.classList.remove('border-blue-400');
                    otherCard.classList.add('border-slate-200/80');
                    const otherIcon = otherCard.querySelector('.accordion-icon');
                    if (otherIcon) {
                        otherIcon.className = 'fa-solid fa-chevron-down text-slate-400 text-xs transition-transform duration-200 accordion-icon';
                    }
                }
            });

            if (isAlreadyOpen) {
                content.classList.add('hidden');
                card.classList.remove('border-blue-400');
                card.classList.add('border-slate-200/80');
                const icon = card.querySelector('.accordion-icon');
                if (icon) {
                    icon.className = 'fa-solid fa-chevron-down text-slate-400 text-xs transition-transform duration-200 accordion-icon';
                }
            } else {
                content.classList.remove('hidden');
                card.classList.remove('border-slate-200/80');
                card.classList.add('border-blue-400');
                const icon = card.querySelector('.accordion-icon');
                if (icon) {
                    icon.className = 'fa-solid fa-chevron-up text-kvBlue text-xs transition-transform duration-200 accordion-icon';
                }
            }
        }

        function filterAllScenarios(keyword) {
            const lowerKey = keyword.toLowerCase().trim();
            const cards = document.querySelectorAll('.scenario-card');
            cards.forEach(card => {
                const searchStr = card.getAttribute('data-search');
                if (searchStr.includes(lowerKey)) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                    const content = card.querySelector('.scenario-content');
                    if (content && !content.classList.contains('hidden')) {
                        content.classList.add('hidden');
                        card.classList.remove('border-blue-400');
                        card.classList.add('border-slate-200/80');
                        const icon = card.querySelector('.accordion-icon');
                        if (icon) {
                            icon.className = 'fa-solid fa-chevron-down text-slate-400 text-xs transition-transform duration-200 accordion-icon';
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
