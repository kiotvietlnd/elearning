<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head> 
    <link rel="icon" type="image/png" href="https://cdn-kvweb.kiotviet.vn/kiotviet-website/wp-content/uploads/2023/10/31095822/64x64.png" sizes="64x64">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Ôn Tập Tình Huống Tư Vấn Tính Năng Sản Phẩm KiotViet FNB</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; font-size: 14px; -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; min-height: 100vh; color: #334155; background-color: #cbd5e1; overflow-x: hidden; }
        .tech-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -10; background: #cbd5e1; }
        .glow-blob-1, .glow-blob-2 { position: absolute; width: 50vw; height: 50vw; filter: blur(140px); border-radius: 50%; transition: background 1.5s ease-in-out; }
        .glow-blob-1 { top: -15%; left: -10%; background: rgba(37, 99, 235, 0.05); } 
        .glow-blob-2 { bottom: -15%; right: -10%; background: rgba(16, 185, 129, 0.05); }
        .glass-panel-ultra { background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0.92)); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.03), inset 0 1px 0 rgba(255, 255, 255, 1); }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; } .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-600 antialiased">

    <div class="tech-bg"><div class="glow-blob-1" id="blob-1"></div><div class="glow-blob-2" id="blob-2"></div></div>

    <div class="min-h-screen flex flex-col bg-slate-200/80 backdrop-blur-[2px]">

        <!-- TIÊU ĐỀ -->
        <header class="sticky top-0 z-50 bg-[#1b365d] border-b border-[#122543] px-6 lg:px-12 py-4 flex items-center justify-between shadow-md">
            <div class="flex items-center gap-4">
                <img src="https://logo.kiotviet.vn/KiotViet-Logo-Horizontal-White.svg" alt="KiotViet Logo" class="h-8">
                <span class="h-6 w-[1px] bg-blue-900/60"></span>
                <h1 class="text-sm font-bold text-white tracking-wider uppercase">TRANG ÔN TẬP TÌNH HUỐNG TƯ VẤN TÍNH NĂNG SẢN PHẨM KIOTVIET FNB</h1>
            </div>
        </header>

        <main class="flex-grow w-full px-4 lg:px-8 xl:px-12 py-6 flex flex-col">
            
            <div class="flex flex-col h-[calc(100vh-170px)] min-h-[500px] w-full">
                
                <!-- MENU CHỌN BUỔI HỌC -->
                <div class="flex justify-start mb-4 flex-shrink-0">
                    <div class="flex w-full max-w-md gap-2 bg-slate-300/40 p-1.5 rounded-2xl border border-slate-300/50">
                        <button onclick="switchSubTab('day1')" id="sub-tab-day1" class="flex-1 py-2 text-xs font-bold rounded-xl transition-all bg-emerald-500 text-white shadow-sm flex items-center justify-center gap-1.5"><i class="fa-solid fa-calendar-day"></i> NGÀY 1</button>
                        <button onclick="switchSubTab('day2')" id="sub-tab-day2" class="flex-1 py-2 text-xs font-bold rounded-xl text-slate-600 hover:text-slate-800 hover:bg-slate-200/50 transition-all flex items-center justify-center gap-1.5"><i class="fa-solid fa-calendar-day"></i> NGÀY 2</button>
                        <button onclick="switchSubTab('day3')" id="sub-tab-day3" class="flex-1 py-2 text-xs font-bold rounded-xl text-slate-600 hover:text-slate-800 hover:bg-slate-200/50 transition-all flex items-center justify-center gap-1.5"><i class="fa-solid fa-calendar-day"></i> NGÀY 3</button>
                    </div>
                </div>

                <div class="flex-grow glass-panel-ultra rounded-3xl overflow-hidden shadow-lg flex flex-col md:flex-row border border-slate-200/60">
                    
                    <!-- SIDEBAR BÀI HỌC -->
                    <div class="w-full md:w-[260px] shrink-0 bg-slate-50/80 border-r border-slate-200 flex flex-col">
                        <div class="p-3 border-b border-slate-200 bg-white/60 flex items-center gap-2">
                            <span class="w-6 h-6 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center"><i class="fa-solid fa-layer-group text-xs"></i></span>
                            <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Danh sách bài học</h3>
                        </div>
                        <div id="lesson-sidebar-list" class="flex-grow overflow-y-auto custom-scroll p-2.5 space-y-3 max-h-[25vh] md:max-h-none">
                        </div>
                    </div>

                    <!-- KHU VỰC DANH SÁCH TÌNH HUỐNG -->
                    <div class="flex-grow p-4 lg:p-6 overflow-y-auto custom-scroll flex flex-col space-y-4">
                        <div class="flex items-center justify-between border-b pb-3 border-slate-100 flex-shrink-0">
                            <div class="flex items-center gap-3">
                                <span class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-base" id="session-header-icon"><i class="fa-solid fa-utensils"></i></span>
                                <h2 class="text-xs font-bold text-slate-800 tracking-wide uppercase" id="session-header-title">PHIÊN 1: KIẾN THỨC FNB NỀN TẢNG</h2>
                            </div>
                        </div>

                        <!-- Ô TÌM KIẾM NHANH TÌNH HUỐNG -->
                        <div class="relative flex-shrink-0">
                            <input type="text" id="searchScenarioInput" onkeyup="filterAllScenarios(this.value)" placeholder="🔍 Tìm nhanh tình huống theo tên, từ khóa..." class="w-full text-xs pl-8 pr-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 bg-white shadow-sm">
                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        </div>

                        <!-- DANH SÁCH TÌNH HUỐNG -->
                        <div id="scenarios-checkbox-list" class="flex-grow overflow-y-auto custom-scroll space-y-3 pr-1">
                            <!-- JS Render danh sách câu hỏi -->
                        </div>
                    </div>

                </div>
            </div>
        </main>

        <!-- FOOTER TÀI LIỆU HỌC TẬP -->
        <footer class="bg-white border-t border-slate-200/80 py-4 px-4 text-center text-sm text-slate-600 mt-auto shrink-0 shadow-sm">
            <div class="w-full leading-relaxed">
                <i class="fa-solid fa-circle-info text-blue-600 mr-1.5"></i>
                Để giải đáp các tình huống trên, bạn có thể tham khảo tài liệu đào tạo của khóa học tại 
                <a href="https://kiotvietlnd.github.io/elearning/khoa-hoc-tai-ky/" target="_blank" class="text-blue-600 hover:text-blue-800 font-bold underline transition-colors">Trang Học liệu Khóa học Tái ký</a> 
                hoặc hướng dẫn sử dụng tính năng tại 
                <a href="https://kiotviet.vn/ho-tro" target="_blank" class="text-blue-600 hover:text-blue-800 font-bold underline transition-colors">Trang Hỗ trợ KiotViet</a>.
            </div>
        </footer>
    </div>

    <script src="codelab-data.js"></script>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzZwkUV8g79PfYExma-7WRFg7IRY2fWmjpb63XiHqu6cqzx03uYi8Wmul9SamvyM9FMgQ/exec"; 
        const SECURITY_TOKEN = "KIOT_RENEWAL_Q3_2026";

        let scenariosData = {};
        let currentDay = 'day1';
        const currentRoadmap = 'FNB'; // Khóa cứng cấu hình mặc định là FNB
        let currentSelectedLesson = null;

        window.onload = function() { loadScenariosFromSheet(); };

        function loadScenariosFromSheet() {
            fetch(`${API_URL}?token=${SECURITY_TOKEN}&action=getScenarios`)
            .then(res => res.json())
            .then(response => {
                if (response.status === "success" && response.data && response.data.length > 0) {
                    scenariosData = { day1: [], day2: [], day3: [] };
                    response.data.forEach(item => {
                        if (!item.Day || item.Day.toString().trim().toLowerCase() === "day") return; 
                        const dayKey = item.Day.toString().trim();
                        if (scenariosData[dayKey]) {
                            scenariosData[dayKey].push({
                                id: item.id || Math.random(), type: item.Type ? item.Type.toString().trim() : "",
                                title: item.Title, question: item.Question, answer: item.Answer,
                                roadmap: item.Roadmap ? item.Roadmap.toString().trim() : "" 
                            });
                        }
                    });
                    switchSubTab('day1');
                }
            });
        }

        // ================= ĐỊNH DẠNG & TRÍCH XUẤT TIÊU ĐỀ =================
        function splitTitle(fullTitle) {
            if (!fullTitle) return { code: "", lesson: "", scenario: "" };
            let code = "", lesson = "", scenario = "";
            const dashIndex = fullTitle.indexOf(" - ");
            if (dashIndex !== -1) {
                code = fullTitle.substring(0, dashIndex).trim();
                const rest = fullTitle.substring(dashIndex + 3).trim();
                const colonIndex = rest.indexOf(": ");
                if (colonIndex !== -1) {
                    lesson = rest.substring(0, colonIndex).trim();
                    scenario = rest.substring(colonIndex + 2).trim();
                } else scenario = rest;
            } else scenario = fullTitle;
            return { code, lesson, scenario };
        }

        function formatQuestionText(text) {
            if (!text) return "";
            let cleanText = text.replace(/\r\n/g, ' ').replace(/\n/g, ' ').replace(/\s+/g, ' ').trim();
            return escapeHtml(cleanText);
        }

        function escapeHtml(string) {
            if (!string) return "";
            return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // ================= ĐIỀU HƯỚNG UI =================
        function switchSubTab(day) {
            currentDay = day;
            
            ['day1', 'day2', 'day3'].forEach(item => {
                const button = document.getElementById(`sub-tab-${item}`);
                if (button) {
                    if (item === day) {
                        button.classList.add('bg-emerald-500', 'text-white', 'shadow-sm');
                        button.classList.remove('text-slate-600');
                    } else {
                        button.classList.remove('bg-emerald-500', 'text-white', 'shadow-sm');
                        button.classList.add('text-slate-600');
                    }
                }
            });

            const headerTitle = document.getElementById('session-header-title');
            if (day === 'day1') headerTitle.textContent = "PHIÊN 1: KIẾN THỨC FNB NỀN TẢNG";
            else if (day === 'day2') headerTitle.textContent = "PHIÊN 2: BÁN HÀNG NÂNG CAO & QUẢN TRỊ ĐA KÊNH";
            else if (day === 'day3') headerTitle.textContent = "PHIÊN 3: PHÁP LÝ THUẾ & KẾ TOÁN HỘ KINH DOANH";

            currentSelectedLesson = null;
            renderLessonSidebar();
        }

        // ================= XỬ LÝ SIDEBAR BÀI HỌC =================
        function renderLessonSidebar() {
            const list = scenariosData[currentDay] ? scenariosData[currentDay].filter(item => item.roadmap === currentRoadmap) : [];
            const sidebar = document.getElementById('lesson-sidebar-list');
            
            if (!list || list.length === 0) { 
                sidebar.innerHTML = '<p class="text-[11px] p-2 text-slate-400 text-center italic">Chưa có bài học</p>'; 
                renderScenariosCheckboxList();
                return; 
            }

            const morningMap = new Map();
            const afternoonMap = new Map();

            list.forEach(item => {
                const parts = splitTitle(item.title);
                const lessonName = parts.lesson || "Chưa phân loại";
                if (item.type === 'morning') {
                    morningMap.set(lessonName, (morningMap.get(lessonName) || 0) + 1);
                } else {
                    afternoonMap.set(lessonName, (afternoonMap.get(lessonName) || 0) + 1);
                }
            });

            let html = "";
            if (morningMap.size > 0) {
                html += `<div class="mb-2"><span class="text-[10px] font-extrabold text-emerald-700 uppercase block mb-1">HỌC PHẦN SÁNG</span><div class="space-y-1">`;
                morningMap.forEach((count, name) => {
                    const isActive = (name === currentSelectedLesson);
                    const activeCss = isActive ? "bg-blue-100 border-blue-300 text-blue-800 shadow-sm" : "bg-white border-slate-200 text-slate-600 hover:bg-slate-100";
                    html += `<button type="button" onclick="selectLesson('${escapeHtml(name)}')" class="w-full text-left px-2.5 py-2 rounded-xl border text-xs font-semibold leading-tight ${activeCss}">${escapeHtml(name)} <span class="opacity-60">(${count})</span></button>`;
                });
                html += `</div></div>`;
            }

            if (afternoonMap.size > 0) {
                html += `<div><span class="text-[10px] font-extrabold text-blue-700 uppercase block mb-1">HỌC PHẦN CHIỀU</span><div class="space-y-1">`;
                afternoonMap.forEach((count, name) => {
                    const isActive = (name === currentSelectedLesson);
                    const activeCss = isActive ? "bg-blue-100 border-blue-300 text-blue-800 shadow-sm" : "bg-white border-slate-200 text-slate-600 hover:bg-slate-100";
                    html += `<button type="button" onclick="selectLesson('${escapeHtml(name)}')" class="w-full text-left px-2.5 py-2 rounded-xl border text-xs font-semibold leading-tight ${activeCss}">${escapeHtml(name)} <span class="opacity-60">(${count})</span></button>`;
                });
                html += `</div></div>`;
            }
            
            sidebar.innerHTML = html;

            if (!currentSelectedLesson) {
                const firstLesson = morningMap.keys().next().value || afternoonMap.keys().next().value;
                if (firstLesson) selectLesson(firstLesson);
                else renderScenariosCheckboxList();
            } else {
                renderScenariosCheckboxList();
            }
        }

        function selectLesson(lessonName) {
            currentSelectedLesson = lessonName;
            renderLessonSidebar();
        }

        // ================= XỬ LÝ DANH SÁCH TÌNH HUỐNG =================
        function renderScenariosCheckboxList() {
            const container = document.getElementById('scenarios-checkbox-list');
            let list = scenariosData[currentDay] ? scenariosData[currentDay].filter(item => item.roadmap === currentRoadmap) : [];
            
            if (currentSelectedLesson) {
                list = list.filter(item => {
                    const parts = splitTitle(item.title);
                    return (parts.lesson || "Chưa phân loại") === currentSelectedLesson;
                });
            }

            if (!list || list.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 py-6 text-center italic">Không có tình huống thuộc bài học này.</p>`;
                return;
            }

            container.innerHTML = list.map((item) => {
                const parts = splitTitle(item.title);
                const questionHtml = formatQuestionText(item.question);

                return `
                    <div class="scenario-card border border-slate-200 rounded-2xl bg-white p-5 shadow-sm hover:border-blue-300 transition-all space-y-3" data-search="${escapeHtml((item.title + ' ' + item.question).toLowerCase())}">
                        <div class="border-b pb-2.5 border-slate-100">
                            <span class="text-xs font-bold text-blue-600 block">${escapeHtml(parts.code || item.title)}</span>
                            <h4 class="text-sm font-bold text-slate-800 mt-1">${escapeHtml(parts.scenario || item.title)}</h4>
                        </div>
                        <div class="space-y-2 text-xs">
                            <div class="text-slate-700 bg-slate-50 p-4 rounded-xl border border-slate-100 leading-relaxed text-sm">
                                <strong class="text-[10px] font-extrabold uppercase text-slate-400 block mb-1">Tình huống ôn tập:</strong>
                                ${questionHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterAllScenarios(keyword) {
            const lowerKey = keyword.toLowerCase().trim();
            const cards = document.querySelectorAll('.scenario-card');
            cards.forEach(card => {
                const searchStr = card.getAttribute('data-search');
                if (searchStr.includes(lowerKey)) card.classList.remove('hidden');
                else card.classList.add('hidden');
            });
        }
    </script>
</body>
</html>
