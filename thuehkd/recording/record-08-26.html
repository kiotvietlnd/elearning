<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Nền đen để video hiển thị đẹp mắt */
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://drive.google.com/file/d/1rwyfK9ZVtO_FbNckNif8kVCmi6aQCzGY/preview" 
        allow="autoplay; fullscreen"
        allowfullscreen>
    </iframe>

</body>
</html>
