        let allLessons = JSON.parse(JSON.stringify(DEFAULT_LESSONS));
        let activeChapterFilter = 'ALL';
        let searchQuery = '';
        let currentModalUrl = '';
        let lastSyncTime = null;

        function cleanText(str) {
            if (!str) return '';
            return str.toString()
                      .normalize('NFD')
                      .replace(/[\u0300-\u036f]/g, '')
                      .replace(/đ/g, 'd').replace(/Đ/g, 'D')
                      .toLowerCase()
                      .trim();
        }

        function isAvailableText(val) {
            if (!val) return false;
            const s = cleanText(val);
            if (!s || s === '-' || s.includes('dang san xuat') || s.includes('dang trien khai') || s.includes('chua co')) {
                return false;
            }
            return true;
        }

        function extractLessonCode(title) {
            const m = title.match(/Bài\s*(\d+\.\d+)/i);
            return m ? m[1] : '';
        }

        // Format iframe link an toàn để nhúng
        function formatIframeUrl(url) {
            if (!url) return '';
            if (url.includes('drive.google.com/file/d/')) {
                return url.replace(/\/(view|edit)(\?.*)?$/, '/preview');
            }
            if (url.includes('docs.google.com/document/d/')) {
                return url.replace(/\/(edit|view)(\?.*)?$/, '/preview');
            }
            return url;
        }

        function findDefaultLesson(stt, title) {
            const code = extractLessonCode(title);
            return DEFAULT_LESSONS.find(l => (code && extractLessonCode(l.title) === code) || l.stt === stt || l.title === title);
        }

        function resolveItem(cellVal, defItem, defaultLabel) {
            if (!cellVal) return defItem || { url: '', label: 'Đang sản xuất' };
            const trimmed = cellVal.trim();
            
            if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
                return { url: trimmed, label: defaultLabel };
            }

            if (!isAvailableText(trimmed)) {
                return { url: '', label: trimmed || 'Đang sản xuất' };
            }

            if (defItem && defItem.url) {
                return { url: defItem.url, label: trimmed };
            }

            return { url: '', label: trimmed };
        }

        // Phân tích dữ liệu CSV trả về từ Google Sheets
        function parseRemoteFeed(rows) {
            if (!rows || rows.length < 2) return false;

            let headerIdx = -1;
            for (let i = 0; i < Math.min(rows.length, 10); i++) {
                const rowStr = cleanText(rows[i].join(' '));
                if (rowStr.includes('bai hoc') && (rowStr.includes('stt') || rowStr.includes('chuong'))) {
                    headerIdx = i;
                    break;
                }
            }

            if (headerIdx === -1) return false;

            const headerRow = rows[headerIdx].map(h => cleanText(h));
            
            let colSTT = -1, colChapter = -1, colTitle = -1, colGiaoAn = -1, colVideo = -1, colWeb = -1, colQuiz = -1, colWorksheet = -1, colPdf = -1;

            for (let c = 0; c < headerRow.length; c++) {
                const h = headerRow[c];
                // Bỏ qua nếu cột 0 là superheader gộp
                if (c === 0 && (h.includes('kiotviet') || h.includes('he sinh thai'))) {
                    colSTT = 0;
                    continue;
                }
                if (colSTT === -1 && (h === 'stt' || h.endsWith('stt'))) colSTT = c;
                if (colChapter === -1 && h.includes('chuong')) colChapter = c;
                if (colTitle === -1 && h.includes('bai hoc')) colTitle = c;
                if (colGiaoAn === -1 && h.includes('giao an')) colGiaoAn = c;
                if (colVideo === -1 && (h.includes('video') || h.startsWith('a -'))) colVideo = c;
                if (colWeb === -1 && (h.includes('github') || h.includes('web') || h.startsWith('b -'))) colWeb = c;
                if (colQuiz === -1 && (h.includes('quiz') || h.includes('trac nghiem') || h.startsWith('c -'))) colQuiz = c;
                if (colWorksheet === -1 && (h.includes('worksheet') || h.includes('thuc hanh') || h.startsWith('d -'))) colWorksheet = c;
                if (colPdf === -1 && (h.includes('pdf') || h.includes('cam nang') || h.includes('tra cuu') || h.startsWith('e -'))) colPdf = c;
            }

            // Fallback cột mặc định nếu không tìm thấy
            if (colSTT === -1) colSTT = 0;
            if (colChapter === -1) colChapter = 1;
            if (colTitle === -1) colTitle = 2;
            if (colGiaoAn === -1) colGiaoAn = 3;
            if (colVideo === -1) colVideo = 4;
            if (colWeb === -1) colWeb = 5;
            if (colQuiz === -1) colQuiz = 6;
            if (colWorksheet === -1) colWorksheet = 7;
            if (colPdf === -1) colPdf = 8;

            const parsed = [];
            for (let i = headerIdx + 1; i < rows.length; i++) {
                const r = rows[i];
                if (!r || r.length === 0) continue;

                const titleVal = (colTitle < r.length && r[colTitle]) ? r[colTitle].trim() : '';
                if (!titleVal || !titleVal.toLowerCase().includes('bài')) continue;

                const sttVal = (colSTT < r.length && r[colSTT]) ? r[colSTT].trim() : (parsed.length + 1).toString();
                const defItem = findDefaultLesson(sttVal, titleVal);
                const chapVal = ((colChapter < r.length && r[colChapter]) ? r[colChapter].trim() : '') || defItem?.chapter || 'Chương 1';

                parsed.push({
                    stt: sttVal,
                    chapter: chapVal,
                    title: titleVal,
                    giaoAn: resolveItem(colGiaoAn < r.length ? r[colGiaoAn] : '', defItem?.giaoAn, 'Giáo án Docs'),
                    video: resolveItem(colVideo < r.length ? r[colVideo] : '', defItem?.video, 'Video MP4'),
                    web: resolveItem(colWeb < r.length ? r[colWeb] : '', defItem?.web, 'Web Học liệu'),
                    quiz: resolveItem(colQuiz < r.length ? r[colQuiz] : '', defItem?.quiz, 'Đề thi 10 cột'),
                    worksheet: resolveItem(colWorksheet < r.length ? r[colWorksheet] : '', defItem?.worksheet, 'Thực hành Word'),
                    pdf: resolveItem(colPdf < r.length ? r[colPdf] : '', defItem?.pdf, 'Cẩm nang PDF')
                });
            }

            if (parsed.length > 0) {
                allLessons = parsed;
                lastSyncTime = new Date();
                updateSyncStatus('success');
                updateTopCounters();
                renderLessons();
                return true;
            }
            return false;
        }

        // Đồng bộ dữ liệu trực tiếp với Google Sheets (Chống Cache hoàn toàn)
        async function fetchLiveFeed(isManual = false) {
            const syncText = document.getElementById('syncText');
            const refreshIcon = document.getElementById('refreshIcon');

            if (refreshIcon) refreshIcon.classList.add('animate-spin');
            if (syncText) syncText.innerText = 'Đang đồng bộ Google Sheets...';

            let success = false;
            for (const endpoint of ENDPOINTS) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 6000);

                    // Thêm cache-busting timestamp và random token
                    const cacheBuster = `t=${Date.now()}&_r=${Math.random()}`;
                    const freshUrl = endpoint.includes('?') ? `${endpoint}&${cacheBuster}` : `${endpoint}?${cacheBuster}`;

                    const response = await fetch(freshUrl, {
                        signal: controller.signal,
                        cache: 'no-store',
                        headers: { 'Pragma': 'no-cache', 'Cache-Control': 'no-cache' }
                    });
                    clearTimeout(timeoutId);

                    if (!response.ok) continue;

                    const csvText = await response.text();
                    const parsedData = Papa.parse(csvText, { skipEmptyLines: 'greedy' });

                    if (parsedData?.data && parseRemoteFeed(parsedData.data)) {
                        success = true;
                        break;
                    }
                } catch (e) {
                    // Thử endpoint tiếp theo
                }
            }

            if (refreshIcon) refreshIcon.classList.remove('animate-spin');

            if (success) {
                if (isManual) showToast('Đã đồng bộ dữ liệu mới nhất từ Google Sheets!', 'success');
            } else {
                updateSyncStatus('fallback');
                if (isManual) showToast('Không thể kết nối Google Sheets, đang dùng bản lưu tạm!', 'error');
            }
        }

        function manualRefresh() {
            fetchLiveFeed(true);
        }

                    const btnVideo = item.video?.url ? `
                        <button onclick="openModal('${item.video.url}', '${safeTitle}', 'VIDEO')" 
                           class="h-9 px-3 rounded-xl bg-rose-50 hover:bg-rose-600 text-rose-700 hover:text-white border border-rose-200 hover:border-rose-600 text-xs font-bold transition-all btn-ready flex items-center justify-center gap-1.5 shadow-2xs" title="Xem Video bài giảng">
                            <i class="fa-solid fa-circle-play text-xs text-rose-600"></i>
                            <span>Video</span>
                        </button>
                    ` : `
                        <div class="h-9 px-3 rounded-xl bg-slate-100 text-slate-400 border border-slate-200 text-xs font-bold flex items-center justify-center gap-1.5 btn-disabled select-none" title="Video bài giảng (Đang sản xuất)">
                            <i class="fa-solid fa-circle-play text-xs text-slate-400"></i>
                            <span>Video</span>
                        </div>
                    `;

                    // 2. NÚT WEB HỌC LIỆU (B)
                    const btnWeb = item.web?.url ? `
                        <button onclick="openModal('${item.web.url}', '${safeTitle}', 'WEB')" 
                           class="h-9 px-3 rounded-xl bg-sky-500 hover:bg-sky-600 text-white border border-sky-500 text-xs font-bold transition-all btn-ready shadow-2xs flex items-center justify-center gap-1.5" title="Mở Web học liệu tương tác">
                            <i class="fa-solid fa-laptop-code text-xs"></i>
                            <span>Web Học liệu</span>
                        </button>
                    ` : `
                        <div class="h-9 px-3 rounded-xl bg-slate-100 text-slate-400 border border-slate-200 text-xs font-bold flex items-center justify-center gap-1.5 btn-disabled select-none" title="Web Học liệu (Đang triển khai)">
                            <i class="fa-solid fa-laptop-code text-xs text-slate-400"></i>
                            <span>Web Học liệu</span>
                        </div>
                    `;

                    // 3. NÚT THỰC HÀNH WORKSHEET (D)
                    const btnWorksheet = item.worksheet?.url ? `
                        <button onclick="openModal('${item.worksheet.url}', '${safeTitle}', 'WORKSHEET')" 
                           class="h-9 px-3 rounded-xl bg-teal-50 hover:bg-teal-600 text-teal-800 hover:text-white border border-teal-300 hover:border-teal-600 text-xs font-bold transition-all btn-ready flex items-center justify-center gap-1.5 shadow-2xs" title="Phiếu bài tập thực hành Word">
                            <i class="fa-solid fa-file-pen text-xs text-teal-600"></i>
                            <span>Thực hành</span>
                        </button>
                    ` : `
                        <div class="h-9 px-3 rounded-xl bg-slate-100 text-slate-400 border border-slate-200 text-xs font-bold flex items-center justify-center gap-1.5 btn-disabled select-none" title="Thực hành Word (Đang sản xuất)">
                            <i class="fa-solid fa-file-pen text-xs text-slate-400"></i>
                            <span>Thực hành</span>
                        </div>
                    `;

                    // 4. NÚT CẨM NANG PDF (E)
                    const btnPdf = item.pdf?.url ? `
                        <button onclick="openModal('${item.pdf.url}', '${safeTitle}', 'PDF')" 
                           class="h-9 px-3 rounded-xl bg-emerald-50 hover:bg-emerald-600 text-emerald-800 hover:text-white border border-emerald-300 hover:border-emerald-600 text-xs font-bold transition-all btn-ready flex items-center justify-center gap-1.5 shadow-2xs" title="Xem Cẩm nang tra cứu 2 trang PDF">
                            <i class="fa-solid fa-file-pdf text-xs text-emerald-600"></i>
                            <span>Cẩm nang PDF</span>
                        </button>
                    ` : `
                        <div class="h-9 px-3 rounded-xl bg-slate-100 text-slate-400 border border-slate-200 text-xs font-bold flex items-center justify-center gap-1.5 btn-disabled select-none" title="Cẩm nang PDF (Đang sản xuất)">
                            <i class="fa-solid fa-file-pdf text-xs text-slate-400"></i>
                            <span>Cẩm nang PDF</span>
                        </div>
                    `;

                    // Badge tiến độ hoàn thiện (4 học liệu: Video A, Web B, Thực hành D, Cẩm nang PDF E)
                    const progressBadge = readyCount === 4 ? `
                        <span class="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800 border border-emerald-300 text-[11px] font-extrabold flex items-center gap-1">
                            <i class="fa-solid fa-circle-check text-emerald-600"></i> Hoàn thành 4/4
                        </span>
                    ` : readyCount > 0 ? `
                        <span class="px-2.5 py-1 rounded-lg bg-blue-100 text-blue-800 border border-blue-300 text-[11px] font-extrabold flex items-center gap-1">
                            <i class="fa-solid fa-spinner text-blue-600"></i> Sẵn sàng ${readyCount}/4
                        </span>
                    ` : `
                        <span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-500 border border-slate-300 text-[11px] font-bold flex items-center gap-1">
                            <i class="fa-regular fa-clock text-slate-400"></i> Đang sản xuất
                        </span>
                    `;

                    fullHtml += `
                        <article class="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 flex flex-col gap-3.5 lesson-card shadow-xs">
                            
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 pb-3 border-b border-slate-100">
                                <div class="flex items-start sm:items-center gap-2.5 min-w-0 flex-1">
                                    <h3 class="text-sm sm:text-base font-extrabold text-slate-900 leading-snug">
                                        ${item.title}
                                    </h3>
                                </div>

                                <div class="flex items-center gap-2 shrink-0 self-start sm:self-auto">
                                    ${progressBadge}
                                </div>
                            </div>

                            <div class="flex items-center justify-end w-full pt-0.5">
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 shrink-0 w-full sm:w-auto justify-end">
                                    ${btnVideo}
                                    ${btnWeb}
                                    ${btnWorksheet}
                                    ${btnPdf}
                                </div>
                            </div>

                        </article>
                    `;
                });
            });

            container.innerHTML = fullHtml;
        }

        // Mở Modal xem học liệu
        function openModal(rawUrl, title, type) {
            if (!rawUrl || rawUrl === '#' || rawUrl === '') {
                showToast('Học liệu này đang trong quá trình sản xuất!', 'error');
                return;
            }

            const modal = document.getElementById('learningModal');
            const iframe = document.getElementById('modalIframe');
            const mTitle = document.getElementById('modalTitle');
            const mBadge = document.getElementById('modalCategoryBadge');
            const extLink = document.getElementById('modalExternalLink');

            if (!modal || !iframe) return;

            currentModalUrl = rawUrl;
            mTitle.textContent = title;

            if (type === 'GIAOAN') {
                mBadge.textContent = 'Giáo Án Docs';
                mBadge.className = 'px-2 py-0.5 rounded text-[10px] font-extrabold uppercase bg-indigo-600 text-white shrink-0';
            } else if (type === 'VIDEO') {
                mBadge.textContent = 'Video Bài Giảng';
                mBadge.className = 'px-2 py-0.5 rounded text-[10px] font-extrabold uppercase bg-rose-600 text-white shrink-0';
            } else if (type === 'WEB') {
                mBadge.textContent = 'Web Học Liệu HTML';
                mBadge.className = 'px-2 py-0.5 rounded text-[10px] font-extrabold uppercase bg-sky-600 text-white shrink-0';
            } else if (type === 'QUIZ') {
                mBadge.textContent = 'Đề Thi LMS 10 Cột';
                mBadge.className = 'px-2 py-0.5 rounded text-[10px] font-extrabold uppercase bg-amber-600 text-white shrink-0';
            } else if (type === 'WORKSHEET') {
                mBadge.textContent = 'Thực Hành Word';
                mBadge.className = 'px-2 py-0.5 rounded text-[10px] font-extrabold uppercase bg-teal-600 text-white shrink-0';
            } else if (type === 'PDF') {
                mBadge.textContent = 'Cẩm Nang Tra Cứu PDF';
                mBadge.className = 'px-2 py-0.5 rounded text-[10px] font-extrabold uppercase bg-emerald-600 text-white shrink-0';
            }

            if (extLink) extLink.href = rawUrl;

            // Xử lý link nhúng an toàn
            const iframeSrc = formatIframeUrl(rawUrl);
            iframe.src = iframeSrc;

            modal.classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
        }

        function closeModal() {
            const modal = document.getElementById('learningModal');
            const iframe = document.getElementById('modalIframe');
            if (!modal) return;
            if (iframe) iframe.src = '';
            modal.classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
        }

        function copyModalLink() {
            if (!currentModalUrl) return;
            navigator.clipboard.writeText(currentModalUrl).then(() => {
                showToast('Đã sao chép liên kết vào clipboard!', 'success');
            }).catch(() => {
                showToast('Không thể sao chép liên kết!', 'error');
            });
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('copy-toast');
            const text = document.getElementById('toast-message');
            const icon = document.getElementById('toast-icon');
            if (!toast || !text) return;

            text.innerText = msg;
            if (icon) {
                icon.className = type === 'success' 
                    ? 'fa-solid fa-circle-check text-emerald-400 text-sm' 
                    : 'fa-solid fa-circle-exclamation text-amber-400 text-sm';
            }

            toast.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
            }, 2500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateTopCounters();
            renderLessons();

            // Tự động đồng bộ ngay khi tải trang
            fetchLiveFeed(false);

            // Tự động kiểm tra và cập nhật định kỳ mỗi 30 giây
            setInterval(() => {
                fetchLiveFeed(false);
            }, 30000);

            // Tự động kiểm tra lại khi người dùng quay lại tab trình duyệt
            window.addEventListener('focus', () => {
                fetchLiveFeed(false);
            });
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    fetchLiveFeed(false);
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });

            document.getElementById('learningModal')?.addEventListener('click', (e) => {
                if (e.target.id === 'learningModal') closeModal();
            });
        });
    </script>
</body>
</html>
